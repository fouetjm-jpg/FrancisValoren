    <style>
        .video-section {
            max-width: 900px;
            margin: 0 auto;
            padding: 60px 20px 80px;
            text-align: center;
        }

        .video-section h1 {
            font-size: 3.5em;
            font-weight: 300;
            color: #e5d6b7;
            margin-bottom: 10px;
        }

        .video-subtitle {
            font-size: 1.3em;
            color: rgba(229, 214, 183, 0.6);
            font-style: italic;
            margin-bottom: 50px;
        }

        .video-grid {
            display: flex;
            flex-direction: column;
            gap: 60px;
        }

        .video-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(199, 156, 82, 0.25);
            border-radius: 8px;
            padding: 30px;
        }

        .video-card h2 {
            font-size: 1.6em;
            color: #d6b16d;
            margin-bottom: 8px;
            font-weight: 400;
        }

        .video-card p {
            font-size: 1.1em;
            color: rgba(229, 214, 183, 0.75);
            margin-bottom: 20px;
            font-style: italic;
        }

        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: 6px;
        }

        .video-wrapper iframe,
        .video-wrapper video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 6px;
        }

        .video-placeholder {
            background: rgba(199, 156, 82, 0.08);
            border: 1px dashed rgba(199, 156, 82, 0.35);
            border-radius: 6px;
            padding: 60px 20px;
            color: rgba(199, 156, 82, 0.5);
            font-size: 1.1em;
            font-style: italic;
        }
    </style>
</head>

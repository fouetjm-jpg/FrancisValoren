    <style>
        .video-section {
            max-width: 900px;
            margin: 0 auto;
            padding: 60px 20px 80px;
            text-align: center;
        }

        .video-section h1 {
            font-size: 3.5em;
            font-weight: 300;
            color: #e5d6b7;
            margin-bottom: 10px;
        }c:\Users\33623\OneDrive\Images\Screenshots\2026-05-30 (22).png

        .video-subtitle {
            font-size: 1.3em;
            color: rgba(229, 214, 183, 0.6);
            font-style: italic;
            margin-bottom: 50px;
        }

        .video-grid {
            display: flex;
            flex-direction: column;
            gap: 60px;
        }

        .video-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(199, 156, 82, 0.25);
            border-radius: 8px;
            padding: 30px;
        }

        .video-card h2 {
            font-size: 1.6em;
            color: #d6b16d;
            margin-bottom: 8px;
            font-weight: 400;
        }

        .video-card p {
            font-size: 1.1em;
            color: rgba(229, 214, 183, 0.75);
            margin-bottom: 20px;
            font-style: italic;
        }

        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: 6px;
        }

        .video-wrapper iframe,
        .video-wrapper video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 6px;
        }

        .video-thumb-link {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: block;
            border-radius: 6px;
            overflow: hidden;
        }

        .video-thumb-link img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: filter 0.3s;
        }

        .video-thumb-link:hover img {
            filter: brightness(0.75);
        }

        .play-btn {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 68px; height: 48px;
            background: rgba(0,0,0,0.75);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .video-thumb-link:hover .play-btn {
            background: #ff0000;
        }

        .play-btn svg {
            width: 24px; height: 24px;
            fill: white;
        }

        .video-placeholder {
            background: rgba(199, 156, 82, 0.08);
            border: 1px dashed rgba(199, 156, 82, 0.35);
            border-radius: 6px;
            padding: 60px 20px;
            color: rgba(199, 156, 82, 0.5);
            font-size: 1.1em;
            font-style: italic;
        }
    </style>
</head>

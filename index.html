    <style>
        #music-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 9999;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 1px solid rgba(199, 156, 82, 0.6);
            background: rgba(20, 18, 12, 0.75);
            backdrop-filter: blur(8px);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: border-color 0.3s, background 0.3s, transform 0.2s;
            padding: 0;
        }
        #music-btn:hover {
            border-color: #c79c52;
            background: rgba(199, 156, 82, 0.15);
            transform: scale(1.08);
        }
        #music-btn svg {
            width: 20px;
            height: 20px;
            fill: #d6b16d;
            transition: opacity 0.3s;
        }
        #music-btn .icon-muted { display: none; }
        #music-btn.muted .icon-playing { display: none; }
        #music-btn.muted .icon-muted { display: block; }
    </style>

    <!-- MUSIQUE D'AMBIANCE PIANO -->
    <button id="music-btn" class="muted" title="Musique d'ambiance" aria-label="Activer la musique">
        <svg class="icon-playing" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
        </svg>
        <svg class="icon-muted" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
        </svg>
    </button>

    <script>
    (function () {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;

        var ctx, masterGain, reverb, active = false, timers = [];

        // Gamme pentatonique Do majeur — 3 octaves douces
        var notes = [
            261.63, 293.66, 329.63, 392.00, 440.00,   // C4 D4 E4 G4 A4
            523.25, 587.33, 659.25, 783.99, 880.00,   // C5 D5 E5 G5 A5
            1046.50, 1174.66, 1318.51                  // C6 D6 E6
        ];

        function buildReverb(c) {
            var len = c.sampleRate * 3, buf = c.createBuffer(2, len, c.sampleRate);
            for (var ch = 0; ch < 2; ch++) {
                var d = buf.getChannelData(ch);
                for (var i = 0; i < len; i++)
                    d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.5);
            }
            var conv = c.createConvolver();
            conv.buffer = buf;
            return conv;
        }

        function playNote(freq, t, dur, vol) {
            // Fondamentale (triangle = chaleur piano)
            var o1 = ctx.createOscillator(), g1 = ctx.createGain();
            o1.type = 'triangle';
            o1.frequency.value = freq;
            g1.gain.setValueAtTime(0, t);
            g1.gain.linearRampToValueAtTime(vol, t + 0.012);
            g1.gain.exponentialRampToValueAtTime(vol * 0.35, t + 0.18);
            g1.gain.exponentialRampToValueAtTime(0.0001, t + dur);
            o1.connect(g1); g1.connect(reverb);
            o1.start(t); o1.stop(t + dur + 0.1);

            // 2e harmonique légère (brillance)
            var o2 = ctx.createOscillator(), g2 = ctx.createGain();
            o2.type = 'sine';
            o2.frequency.value = freq * 2;
            g2.gain.setValueAtTime(0, t);
            g2.gain.linearRampToValueAtTime(vol * 0.12, t + 0.008);
            g2.gain.exponentialRampToValueAtTime(0.0001, t + dur * 0.6);
            o2.connect(g2); g2.connect(reverb);
            o2.start(t); o2.stop(t + dur);
        }

        function schedule() {
            if (!active) return;
            var now = ctx.currentTime;
            var freq = notes[Math.floor(Math.random() * notes.length)];
            var vol  = 0.025 + Math.random() * 0.035;
            var dur  = 2.5 + Math.random() * 3.5;
            playNote(freq, now, dur, vol);

            // Accord doux ~30 % du temps
            if (Math.random() < 0.3) {
                var f2 = notes[Math.floor(Math.random() * notes.length)];
                playNote(f2, now + 0.06, dur * 0.85, vol * 0.65);
            }

            var delay = (1.2 + Math.random() * 2.8) * 1000;
            timers.push(setTimeout(schedule, delay));
        }

        function start() {
            if (!ctx) {
                ctx = new AC();
                reverb = buildReverb(ctx);
                masterGain = ctx.createGain();
                masterGain.gain.value = 0.8;
                reverb.connect(masterGain);
                masterGain.connect(ctx.destination);
            }
            if (ctx.state === 'suspended') ctx.resume();
            active = true;
            schedule();
        }

        function stop() {
            active = false;
            timers.forEach(clearTimeout);
            timers = [];
            if (masterGain) {
                masterGain.gain.setTargetAtTime(0, ctx.currentTime, 0.8);
            }
        }

        var btn = document.getElementById('music-btn');
        btn.addEventListener('click', function () {
            if (!active) {
                start();
                btn.classList.remove('muted');
                btn.setAttribute('aria-label', 'Couper la musique');
            } else {
                stop();
                btn.classList.add('muted');
                btn.setAttribute('aria-label', 'Activer la musique');
            }
        });
    })();
    </script>

</body>

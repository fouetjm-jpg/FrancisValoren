name: Threads Auto Post

on:
  schedule:
    - cron: '0 7 * * *'   # 8h00 heure française (UTC+1)
    - cron: '0 11 * * *'  # 12h00 heure française (UTC+1)
    - cron: '0 19 * * *'  # 20h00 heure française (UTC+1)
  workflow_dispatch:       # Permet de lancer manuellement

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Post to Threads
        id: post
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: |
          OUTPUT=$(python threads_agent/post_now.py)
          echo "$OUTPUT"
          echo "post_output<<EOF" >> $GITHUB_OUTPUT
          echo "$OUTPUT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Envoyer notification email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.mail.yahoo.com
          server_port: 587
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "✅ Post Threads publié — FrancisValoren"
          to: fouetjm@yahoo.fr
          from: fouetjm@yahoo.fr
          body: |
            Bonjour,

            Un nouveau post a été publié sur Threads avec succès.

            ──────────────────────────────
            ${{ steps.post.outputs.post_output }}
            ──────────────────────────────

            Bonne journée !

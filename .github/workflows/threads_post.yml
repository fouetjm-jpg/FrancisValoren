name: Threads Auto Post

on:
  schedule:
    - cron: '0 7 * * *'   # 8h00 heure française (UTC+1)
    - cron: '0 11 * * *'  # 12h00 heure française (UTC+1)
    - cron: '0 19 * * *'  # 20h00 heure française (UTC+1)
  workflow_dispatch:       # Permet de lancer manuellement

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Post to Threads
        id: post
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
        run: |
          OUTPUT=$(python threads_agent/post_now.py)
          echo "$OUTPUT"
          echo "post_output<<EOF" >> $GITHUB_OUTPUT
          echo "$OUTPUT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          if echo "$OUTPUT" | grep -q "DERNIER_POST_DU_JOUR=true"; then
            echo "dernier_post=true" >> $GITHUB_OUTPUT
          else
            echo "dernier_post=false" >> $GITHUB_OUTPUT
          fi

      - name: Envoyer récapitulatif du jour
        if: steps.post.outputs.dernier_post == 'true'
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.mail.yahoo.com
          server_port: 587
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "📅 Posts du jour publiés — FrancisValoren"
          to: fouetjm@yahoo.fr
          from: fouetjm@yahoo.fr
          body: |
            Bonjour,

            Les 3 posts du jour ont été publiés avec succès.

            ──────────────────────────────
            ${{ steps.post.outputs.post_output }}
            ──────────────────────────────

            Bonne soirée !
